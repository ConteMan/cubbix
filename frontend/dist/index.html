<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src blob:; connect-src 'none'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css"></head>
<body>
<header id="toolbar"><div id="title"></div><div id="drag"></div><div id="top-actions"></div></header>
<main id="workspace">
<div id="editor"><div id="empty" aria-hidden="true"></div></div>
<div id="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>
<div id="result"></div>
</main>
<footer><div id="expression"><label for="suffix">this</label><input id="suffix" autocomplete="off" autocapitalize="off" spellcheck="false"><span id="status" tabindex="0" role="status"></span></div><div id="tools"></div></footer>
<div id="tooltip" role="tooltip" hidden></div>
<script src="main.js"></script>
</body></html>
